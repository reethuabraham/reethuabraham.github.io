  <style>
  :root {
    --bg-main: #0b1325;
    --bg-secondary: #132038;
    --bg-card: rgba(23, 39, 68, 0.85);
    --bg-light: #f4efe6;
    --text-primary: #f4efe6;
    --text-secondary: #b5c2d5;
    --text-dark: #0b1325;
    --text-dark-muted: #3a475d;
    --accent-coral: #ff6b5b;
    --accent-coral-dark: #c83d2c;
    --accent-gold: #e5a963;
    --accent-gold-dark: #9e641c;
    --line: rgba(244, 239, 230, 0.15);
    --line-bright: rgba(255, 107, 91, 0.45);
    --line-dark: rgba(11, 19, 37, 0.18);
    --serif: 'Instrument Serif', Georgia, serif;
    --sans: 'Plus Jakarta Sans', sans-serif;
    --display: 'Syne', sans-serif;
    --mono: 'DM Mono', monospace;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 100px; }
  body {
    margin: 0;
    background: var(--bg-main);
    color: var(--text-primary);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.75;
    overflow-x: hidden;
    position: relative;
  }

  /* Ambient Glow Effect */
  body::before {
    content: '';
    position: fixed;
    top: -20%;
    left: -10%;
    width: 65vw;
    height: 65vw;
    background: radial-gradient(circle, rgba(255, 107, 91, 0.08) 0%, rgba(11, 19, 37, 0) 70%);
    pointer-events: none;
    z-index: 0;
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: none; }

  /* Reading Progress Bar */
  .reading-progress {
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: transparent;
  }
  .reading-progress span {
    display: block;
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, var(--accent-gold), var(--accent-coral));
    box-shadow: 0 0 10px var(--accent-coral);
    transition: width 0.1s linear;
  }

  /* Header Navigation */
  .header {
    height: 84px;
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(11, 19, 37, 0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 max(5vw, 24px);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font: 800 20px var(--display);
    letter-spacing: -0.5px;
  }
  .logo-mark {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    background: var(--accent-coral);
    color: var(--bg-main);
    font: 700 18px var(--serif);
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(255, 107, 91, 0.4);
  }
  .accent { color: var(--accent-coral); }
  
  .nav {
    display: flex;
    align-items: center;
    gap: 32px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .nav a { transition: color 0.25s; }
  .nav a:hover { color: var(--accent-coral); }
  .nav-cta {
    border: 1px solid var(--line-bright);
    padding: 10px 22px;
    border-radius: 30px;
    color: var(--text-primary) !important;
    background: rgba(255, 107, 91, 0.08);
    transition: all 0.3s !important;
  }
  .nav-cta:hover {
    background: var(--accent-coral);
    color: var(--bg-main) !important;
    box-shadow: 0 0 20px rgba(255, 107, 91, 0.4);
    transform: translateY(-2px);
  }
  .menu-toggle { display: none; background: none; border: 0; }

  .section-wrap {
    width: min(1180px, 88%);
    margin: auto;
    position: relative;
    z-index: 1;
  }

  /* Hero Section */
  .hero {
    min-height: 740px;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    align-items: center;
    position: relative;
    padding-top: 60px;
    padding-bottom: 90px;
  }
  .hero-grid {
    position: absolute;
    inset: 0 0 0 35%;
    opacity: 0.2;
    background-image: 
      linear-gradient(rgba(244, 239, 230, 0.1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(244, 239, 230, 0.1) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
    pointer-events: none;
  }
  .hero-copy { position: relative; z-index: 2; padding: 20px 0; }
